[project]
name = "glimpse"
version = "0.1.0"
description = "Previews for Epsilon's .lookup results: the addon's generator, checks and tests."
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
]

[dependency-groups]
dev = [
    "lupa>=2.8",
    "mypy>=2.4.0",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["*_test.py"]
pythonpath = ["tools", "generator", "test/lua"]

[tool.mypy]
strict = true
mypy_path = ["tools", "generator", "test/lua"]
files = ["tools", "generator", "test"]
explicit_package_bases = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
