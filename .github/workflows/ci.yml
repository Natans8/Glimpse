name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CI runs the requires-python floor, which every compiled dependency has a
      # wheel for; a machine may run newer.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version
      - uses: taiki-e/install-action@v2
        with:
          tool: selene
      - run: uv sync
      - run: uv run python tools/check.py
